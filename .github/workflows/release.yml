name: release

# Tag a commit (`git tag v0.2.0 && git push origin v0.2.0`) and this builds the
# module, packs the release archive and publishes a GitHub release:
#
#   house-builder-<version>.zip  the archive the installer downloads
#   house-builder.zip            the same archive under a stable name, so
#                                releases/latest/download/house-builder.zip works
#   latest.json                  the signed update feed, only when plugin.json
#                                declares `update.public_key`
#
# A build without self-update declares no `update` block (older ABI 1 hosts
# refuse it), so its release has no feed: the installer uses the stable archive
# name and the plugin is updated by running the installer again.
#
# The archive holds exactly plugin.json and the module: BIMCraft refuses an
# update archive with any other file.
#
# Secret, only for a self-updating manifest: PLUGIN_SIGNING_KEY — the Ed25519
# private key in PEM (see scripts/make-signing-key.sh).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the tag against the manifest
        run: |
          VERSION="$(python3 -c 'import json;print(json.load(open("plugin.json"))["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} and plugin.json ${VERSION} disagree"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "MODULE=$(python3 -c 'import json;print(json.load(open("plugin.json"))["module"])')" >> "$GITHUB_ENV"

      - name: Install the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the module
        run: cargo build --release --locked --target wasm32-unknown-unknown

      - name: Pack the update archive
        run: |
          mkdir -p dist/stage
          cp plugin.json dist/stage/plugin.json
          BUILT="$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | head -n 1)"
          if [ -z "${BUILT}" ]; then
            echo "::error::the build produced no module"
            exit 1
          fi
          cp "${BUILT}" "dist/stage/${MODULE}"
          (cd dist/stage && zip -q -r "../house-builder-${VERSION}.zip" .)
          cp "dist/house-builder-${VERSION}.zip" dist/house-builder.zip
          unzip -l "dist/house-builder-${VERSION}.zip"

      - name: Decide whether the manifest declares an update feed
        id: update_feed
        run: |
          if python3 -c 'import json,sys; sys.exit(0 if (json.load(open("plugin.json")).get("update") or {}).get("public_key") else 1)'; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "plugin.json declares no update.public_key: this release carries no update feed."
          fi

      - name: Build and sign the feed
        if: steps.update_feed.outputs.signed == 'true'
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "${PLUGIN_SIGNING_KEY}" ]; then
            echo "::error::add the repository secret PLUGIN_SIGNING_KEY (scripts/make-signing-key.sh prints it)"
            exit 1
          fi
          KEY="${RUNNER_TEMP}/signing-key.pem"
          umask 077
          printf '%s\n' "${PLUGIN_SIGNING_KEY}" > "${KEY}"
          FEED_NOTES="$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")"
          export FEED_NOTES="${FEED_NOTES:-House Builder ${VERSION}}"
          FEED_KEY="${KEY}" python3 scripts/make-feed.py
          rm -f "${KEY}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.update_feed.outputs.signed }}
        run: |
          assets=("dist/house-builder-${VERSION}.zip" "dist/house-builder.zip")
          if [ "${SIGNED}" = "true" ]; then
            assets+=("dist/latest.json")
          fi
          gh release create "v${VERSION}" "${assets[@]}" \
            --title "House Builder ${VERSION}" \
            --generate-notes
